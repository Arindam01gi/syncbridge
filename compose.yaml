services:
  postgres:
    image : postgres:16
    container_name : syncbridge_postgres
    restart : unless-stopped
    environment :
      POSTGRES_DB : syncbridge
      POSTGRES_USER : syncbridge
      POSTGRES_PASSWORD : Password_123
    ports:
     - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syncbridge -d syncbridge"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: